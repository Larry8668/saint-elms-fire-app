[package]
name = "saint-elms-fire"
version = "0.1.0"
description = "Saint Elms Fire desktop shell"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "saint_elms_fire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

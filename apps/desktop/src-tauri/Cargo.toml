[package]
name = "saint-elms-fire"
version = "0.1.0"
description = "Saint Elms Fire desktop shell"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "saint_elms_fire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Seat provisioning (src/seat): Instabox calls run here because api.instabox.sh has no CORS,
# and the student's key belongs in the OS keychain rather than in webview storage.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

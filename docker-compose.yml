# Self-hostable stack.
#   docker compose up -d --build                  → uni server + web search + engine (uses Ollama on the host)
#   docker compose --profile ollama up -d --build → also runs Ollama in a container
#   docker compose up -d searxng                  → just web search, for `pnpm dev` (same as `pnpm search:up`)
name: saint-elms-fire

x-node-service: &node-service
  build:
    context: .
    dockerfile: infra/docker/node-service.Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sef_uni
      POSTGRES_USER: sef
      POSTGRES_PASSWORD: ${UNI_DB_PASSWORD:-sef-uni-local-dev-only}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - uni-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sef -d sef_uni"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [uni-db]

  uni:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: "@sef/uni-server" }
      target: uni
    environment:
      UNI_PORT: "4200"
      UNI_HOST: 0.0.0.0
      COURSEWARE_DIR: /courseware
      KEYS_DIR: /data/keys
      UNI_DATA_DIR: /data
      UNI_PUBLIC_URL: ${UNI_PUBLIC_URL:-http://localhost:4200}
      UNI_TRUSTED_ORIGINS: ${UNI_TRUSTED_ORIGINS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:-}
      # Seeded accounts get this password, so it must be chosen by the operator — never a
      # shipped default. Production refuses to boot with the public demo password anyway;
      # requiring it here fails at `compose up` with a clear message instead of crash-looping.
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env to a private value — see .env.example}
      SEED_DEMO: ${SEED_DEMO:-true}
      UNI_DATABASE_URL: postgresql://sef:${UNI_DB_PASSWORD:-sef-uni-local-dev-only}@postgres:5432/sef_uni
    volumes:
      - ./courseware:/courseware:ro
      - uni-data:/data
    ports: ["4200:4200"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
    networks: [default, uni-db]

  mailpit:
    # Development-only loopback mail catcher: `docker compose --profile mail up -d mailpit`.
    # Account emails fail unless a real MAIL_SMTP_URL is configured; starts nothing by default.
    image: axllent/mailpit:v1.20.3
    profiles: ["mail"]
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-for-public-deployments}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:8888:8080"]

  engine:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: "@sef/engine" }
    environment:
      ENGINE_PORT: "4100"
      ENGINE_HOST: 0.0.0.0
      # The port is published on host loopback only, so a direct caller arrives from the
      # Docker bridge gateway: count it as this device (profile picker, offline unlock).
      # Without this — or ENGINE_PUBLIC_HOST — a non-loopback bind refuses to start.
      # Default is Docker's bridge range only. Colima/Docker Desktop setups whose bridge is
      # on 192.168.x can set ENGINE_DEVICE_PEERS explicitly in .env (e.g. 192.168.0.0/16).
      ENGINE_DEVICE_PEERS: ${ENGINE_DEVICE_PEERS:-172.16.0.0/12}
      ENGINE_DATA_DIR: /data
      UNI_SERVER_URL: http://uni:4200
      SEARXNG_URL: http://searxng:8080
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      COURSEWARE_DIR: /courseware
      # Seeding is opt-in in the engine; the demo stack opts in, overridable from .env.
      SEED_DEMO: ${SEED_DEMO:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - engine-data:/data
      - ./courseware:/courseware:ro
    ports: ["127.0.0.1:4100:4100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      uni: { condition: service_healthy }

  gateway:
    # Central model gateway (docs/model-gateway.md): authenticated, load-balanced proxy in
    # front of Ollama/vLLM workers. Opt-in: `docker compose --profile gateway up -d gateway`.
    # The engine above still talks to Ollama directly unless pointed here.
    <<: *node-service
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: "@sef/gateway" }
    environment:
      GATEWAY_PORT: "4300"
      GATEWAY_HOST: 0.0.0.0
      # Comma list of workers; with `--profile ollama` use http://ollama:11434.
      GATEWAY_UPSTREAMS: ${GATEWAY_UPSTREAMS:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["127.0.0.1:4300:4300"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports: ["127.0.0.1:11434:11434"]

networks:
  default: {}
  uni-db:
    internal: true

volumes:
  uni-data:
  uni-postgres-data:
  engine-data:
  ollama-models:

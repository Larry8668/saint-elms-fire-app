use_default_settings:
  engines:
    # General web, an encyclopedia and open scholarly indexes (OpenAlex and Semantic Scholar cover arXiv).
    # Engines that captcha self-hosted instances (google, startpage, qwant, yahoo) are left out;
    # duckduckgo and brave stay as fallbacks for networks where they still answer.
    keep_only:
      - bing
      - wikipedia
      - openalex
      - semantic scholar
      - crossref
      - mojeek
      - duckduckgo
      - brave

server:
  # Overridden by the SEARXNG_SECRET environment variable.
  secret_key: "change-me-for-public-deployments"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0

# Several of these ship disabled upstream; enable them explicitly.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: openalex
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: crossref
    disabled: false
